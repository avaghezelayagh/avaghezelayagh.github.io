- title: "Linking fluvial barriers and habitat specialization in the evolution of microendemism in riverine fishes"
  authors: "MF Stokes, D Kim, BW Albanese, DJ MacGuigan, MB Davidson, A Ghezelayagh, TJ Near"
  venue: "Evolution 80 (9), 2030"
  year: 2026
  url: "https://doi.org/10.1093/evolut/qpag123"
  summary: "In the Holiday Darter species complex, specialization to high-elevation streams on metamorphic rock, together with knickpoints that block dispersal between tributaries, created the isolation that produced microendemic lineages."
  image: "/images/pubs/holiday-darters.jpg"
  cover: "Holiday Darters"
  tone: river

- title: "Alternative pathways into the deep sea: patterns in Bivalvia"
  authors: "A Ghezelayagh, SM Edie, D Jablonski"
  venue: "Proceedings of the Royal Society B"
  year: 2026
  url: "https://pubmed.ncbi.nlm.nih.gov/41667109/"
  summary: "Deep-sea endemic lucinid clams arrived piecemeal through as many as 16 independent entries, whereas mussels entered only four times and then diversified in place. The contrast may trace back to differences in ancestral feeding mode."
  image: ""
  cover: "Deep-sea bivalves"
  tone: deep
  press:
    - label: "UChicago News"
      url: "https://news.uchicago.edu/story/uchicago-paleontologists-investigate-how-life-entered-and-adapted-deep-sea"
    - label: "Phys.org"
      url: "https://phys.org/news/2026-03-paleontologists-life-deep-sea.html"

