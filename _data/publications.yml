# Publications shown on the home page, newest first.
#
# Fields:
#   title, authors, venue, year, url  – citation details
#   free_url                          – optional open-access copy (preprint / PMC)
#   summary                           – one or two sentences shown under the citation
#   image                             – figure shown next to the paper. A path in this repo
#                                       (e.g. /images/pubs/snail-darter.jpg) or a full URL.
#                                       Leave blank to show a styled cover instead.
#   cover                             – short label printed on the styled cover
#   tone                              – cover colour: ocean, deep, reef, river, sand
#   press                             – optional list of {label, url} news coverage links
#
# "A Ghezelayagh" is bolded automatically in the author list.

