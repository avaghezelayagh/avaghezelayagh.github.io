  free_url: "https://www.biorxiv.org/content/10.1101/2024.01.12.575380.full"
  summary: "Anglerfishes moved into the midnight zone 50–35 million years ago, during a period of global warming. Sexual parasitism, size dimorphism and the loss of adaptive immunity worked together to fuel their radiation."
